<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="first-pic">
        <h1>Lily</h1>
        <div class="box">
            <div class="main-part">
                <img class="lily-img"
                    src="https://thumbs.dreamstime.com/b/ripe-rice-paddy-field-ready-harvest-362249057.jpg?w=992">
                <div class="content-first-pic">
                    <p class="title">NICE<b>LILY</b></p>
                    <p class="para">LILY LIKES TO PLAY WITH CRAYONS AND PENCILS</p>
                </div>
                <div class="lily-layer"></div>
            </div>
            <div class="concealed-block lily-concealed-block"></div>
            <div class="concealed-block lily-concealed-block"></div>
        </div>
    </div>

    <div class="second-pic">
        <h1>Sadie</h1>
        <div class="box">
            <div class="main-part">
                <img class="sadie-img"
                    src="https://cdn.sanity.io/images/fqi4t24y/production/dbfb6522d3877e04be12946a321ff5a591dd7ec7-8192x5464.jpg">
                <div class="content-sec-pic">
                    <p class="title" id="sadie-title">HOLY<b>SADIE</b></p>
                    <p class="para" id="sadie-para">SADIE NEVER TOOK HER EYES OFF ME.<br>SHE HAD A DARK SOUL</p>
                </div>
                <div class="sadie-layer"></div>
            </div>
            <div class="concealed-block" id="sadie-concealed-block"></div>
        </div>
    </div>
</body>

</html>
